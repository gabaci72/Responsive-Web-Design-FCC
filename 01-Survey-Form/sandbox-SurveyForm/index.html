<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 id="title">Survey Form</h1>
    <p id="description">Please fill out this form with the required information.</p>
    <div id="progress-bar"></div>
    <form id="survey-form">
        <label id="name-label" for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>

        <label id="email-label" for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <span id="email-error" class="error-message"></span>

        <label id="number-label" for="number">Age:</label>
        <input type="number" id="number" name="number" min="1" max="120" placeholder="Enter your age" required>

        <label id="dropdown-label" for="dropdown">Select an option:</label>
        <select id="dropdown" name="dropdown">
            <option value="option1">Option 1</option>
            <option value="option2">Option 2</option>
            <option value="other">Other</option>
        </select>
        <div id="other-field" style="display: none;">
            <label for="other-input">Please specify:</label>
            <input type="text" id="other-input" name="other-input">
        </div>

        <fieldset>
            <legend>Choose a radio button:</legend>
            <label>
                <input type="radio" name="radio-group" value="radio1"> Radio 1
            </label>
            <label>
                <input type="radio" name="radio-group" value="radio2"> Radio 2
            </label>
        </fieldset>

        <fieldset>
            <legend>Select checkboxes:</legend>
            <label>
                <input type="checkbox" name="checkbox-group" value="checkbox1"> Checkbox 1
            </label>
            <label>
                <input type="checkbox" name="checkbox-group" value="checkbox2"> Checkbox 2
            </label>
        </fieldset>

        <label for="comments">Additional Comments:</label>
        <textarea id="comments" name="comments" placeholder="Enter your comments"></textarea>

        <button id="submit" type="submit">Submit</button>
    </form>
    <script src="script.js"></script>
</body>
</html>
